name: publish-npm

# Push a tag like js-v0.1.1 to STAGE js/ on npm with trusted publishing (OIDC).
# No NPM_TOKEN: npm trusts this repository and workflow file (trusted publisher on
# npmjs.com, allowed action "npm stage publish" only). The release goes public only after
# a maintainer approves it with 2FA: npmjs.com -> Staged Packages, or `npm stage approve <id>`.
# Staged publishing needs npm CLI >= 11.15.0 and Node >= 22.14; provenance comes from
# publishConfig.provenance in package.json.
on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm CLI new enough for staged trusted publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version
      - name: Tag must match the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "js-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != js-v${version}"; exit 1; }
          grep -q "export const VERSION = \"${version}\";" src/index.js || { echo "src/index.js VERSION != ${version}"; exit 1; }
      - run: npm test
      - run: npm stage publish --access public
