name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline tests (no x402 SDK)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -q -rs

  python-integrations:
    # The real x402 SDK (local EIP-3009 signing with a throwaway key) and real langchain-core.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,x402,langchain]"
          pytest -q -rs
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline tests (no dependencies)
        run: npm test

  node-integrations:
    # The real @x402/fetch + @x402/evm + viem (local signing with a throwaway key).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @x402/fetch @x402/evm viem ai zod
      - run: npm test
      - name: agentharbor/ai builds real AI SDK tools
        run: |
          node --input-type=module -e '
            import { createAgentHarbor } from "agentharbor";
            import { agentHarborTools } from "agentharbor/ai";
            const tools = agentHarborTools(createAgentHarbor());
            const names = Object.keys(tools);
            if (names.length !== 5 || typeof tools.agentharbor_company.execute !== "function" || !tools.agentharbor_company.inputSchema) {
              throw new Error("unexpected tools: " + names);
            }
            console.log("ok", names.join(", "));
          '
      - run: npm pack --dry-run
